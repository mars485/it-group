services:
  web:
    build: .
    container_name: itgroup-site
    restart: unless-stopped
    env_file: .env
    ports:
      - "8000:8000"
    volumes:
      - itgroup_data:/app/data
      - itgroup_uploads:/app/media
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/', timeout=5)"]
      interval: 30s
      timeout: 8s
      retries: 3
      start_period: 40s

volumes:
  itgroup_data:
  itgroup_uploads:
