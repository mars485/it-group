name: Astro build
on:
  push:
    branches: [astro-migration]
  workflow_dispatch:
  pull_request:
    paths: ['astro/**', 'static/**']
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install
        working-directory: astro
      - name: Build static site
        run: npm run build
        working-directory: astro
      - name: Package static site
        if: github.event_name != 'pull_request'
        run: tar -C astro/dist -czf it-group-site.tar.gz .
      - name: Upload deployable static site
        uses: actions/upload-artifact@v4
        with:
          name: it-group-static
          path: astro/dist/
          if-no-files-found: error
          retention-days: 14
      - name: Publish stable direct download
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/astro-migration'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view site-preview-latest >/dev/null 2>&1; then
            gh release create site-preview-latest --target "$GITHUB_SHA" --title "IT GROUP — Astro preview" --notes "Предварительная версия. Формы и политика персональных данных требуют настройки перед публичным запуском." --prerelease
          fi
          gh release upload site-preview-latest it-group-site.tar.gz --clobber
